model:
  vocab_size: 6400
  hidden_size: 128
  num_hidden_layers: 4
  num_attention_heads: 4
  num_key_value_heads: 2
  max_seq_len: 512
  kda_decay_rank: 32
  mla_kv_lora_rank: 32
  attnres_layers_per_block: 2
  num_dense_layers: 1
  num_routed_experts: 8
  num_experts_per_token: 2
  num_shared_experts: 1
  moe_latent_size: 64
  moe_intermediate_size: 128
  shared_intermediate_size: 256
  mtp_loss_weight: 0.3
  expert_qat: false
training:
  sequence_length: 256
  batch_size: 4
  gradient_accumulation_steps: 4
  epochs: 1
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_ratio: 0.01
  optimizer: muon
  precision: bf16
  device: auto
  log_every: 10
  save_every: 500
