# Architecture-shape reference only. The readable PyTorch KDA recurrence in
# this repository is not a distributed/fused implementation for 2.8T training.
model:
  vocab_size: 163840
  hidden_size: 7168
  num_hidden_layers: 93
  num_attention_heads: 96
  num_key_value_heads: 96
  head_dim: 128
  max_seq_len: 1048576
  rms_norm_eps: 0.00001
  kda_decay_rank: 128
  mla_q_lora_rank: 1536
  mla_kv_lora_rank: 512
  mla_qk_nope_head_dim: 128
  mla_qk_direct_head_dim: 64
  mla_v_head_dim: 128
  attnres_layers_per_block: 12
  num_dense_layers: 1
  num_routed_experts: 896
  num_experts_per_token: 16
  num_shared_experts: 2
  moe_latent_size: 3584
  moe_intermediate_size: 3072
  dense_intermediate_size: 33792
  shared_intermediate_size: 3072
  situ_beta: 4.0
  situ_linear_beta: 25.0
  expert_qat: true
  tie_word_embeddings: false
  bos_token_id: 163584
  eos_token_id: 163586
  pad_token_id: 163839
training:
  sequence_length: 8192
  batch_size: 1
  gradient_accumulation_steps: 1
  epochs: 1
  optimizer: muon
  precision: bf16
